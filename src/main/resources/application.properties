spring.application.name=ModaFacil
logging.level.org.thymeleaf=DEBUG
logging.level.org.springframework.web.servlet.PageNotFound=WARN

# Base de datos MySQL (importar database/modafacil.sql antes de ejecutar)
spring.datasource.url=jdbc:mysql://localhost:3306/modafacil?useSSL=false&serverTimezone=America/Lima&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=

management.endpoints.web.exposure.include=health,metrics

# Diagnóstico temporal de errores
logging.level.org.springframework.web=DEBUG
logging.level.org.springframework.jdbc.core=DEBUG
logging.level.org.springframework.web.servlet.mvc.method.annotation.ExceptionHandlerExceptionResolver=DEBUG
