<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
    <head th:replace="~{layout :: head('style-global.css')}">
        <title>Página no encontrada - ImportaFácil</title>
    </head>
    <body class="bg-white text-dark d-flex flex-column min-vh-100">

        <!-- HEADER -->
        <div th:replace="~{layout :: header}"></div>

        <!-- MAIN -->
        <main class="container my-auto text-center py-5">
            <div class="row justify-content-center">
                <div class="col-md-6">
                    <i class="bi bi-exclamation-triangle-fill text-warning" style="font-size: 5rem;"></i>
                    <h1 class="display-1 fw-bold text-primary mt-3">404</h1>
                    <h2 class="fw-bold text-dark">¡Ups! Página no encontrada</h2>
                    <p class="text-muted my-4">
                        Lo sentimos, la página que estás buscando no existe o ha sido movida a otra dirección.
                    </p>
                    <a href="/" class="btn btn-success px-4 py-2 rounded-3 fw-bold border-0">
                        Volver a la Página Principal
                    </a>
                </div>
            </div>
        </main>

        <!-- FOOTER -->
        <div th:replace="~{layout :: footer}"></div>
    </body>
</html>
