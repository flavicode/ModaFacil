<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">

    <head th:replace="~{layout :: head('productos.css', 'Catalogo de Prendas')}"></head>

    <body class="catalogo-page">

        <!-- HEADER EXISTENTE -->
        <div th:replace="~{layout :: header}"></div>

        <main class="container catalogo-main py-5">

            <!-- TÍTULO -->
            <section class="mb-4">
                <h1 class="catalogo-titulo fw-bold mb-3">
                    Catálogo de Prendas
                </h1>

                <p class="catalogo-descripcion mb-4">
                    Encuentra las prendas perfectas para tu negocio con
                    total facilidad y transparencia...
                </p>

                <!-- BUSCADOR -->
                <div class="buscador-wrapper position-relative">
                    <i class="bi bi-search buscador-icono"></i>

                    <input
                        type="search"
                        id="input-buscador"
                        class="form-control buscador-input"
                        placeholder="Buscar por nombre, categoría, talla..."
                        aria-label="Buscar prendas">
                </div>
            </section>

            <!-- CATEGORÍAS -->
            <section class="mb-4">
                <div id="contenedor-categorias"
                    class="d-flex flex-wrap justify-content-center gap-3">

                    <button type="button"
                            class="btn categoria-btn active"
                            data-categoria="Todas">
                        Todas
                    </button>

                    <button type="button"
                            class="btn categoria-btn"
                            data-categoria="Polos">
                        Polos
                    </button>

                    <button type="button"
                            class="btn categoria-btn"
                            data-categoria="Pantalones">
                        Pantalones
                    </button>

                    <button type="button"
                            class="btn categoria-btn"
                            data-categoria="Vestidos">
                        Vestidos
                    </button>

                    <button type="button"
                            class="btn categoria-btn"
                            data-categoria="Blusas">
                        Blusas
                    </button>

                    <button type="button"
                            class="btn categoria-btn"
                            data-categoria="Chaquetas">
                        Chaquetas
                    </button>

                </div>
            </section>

            <!-- CONTADOR -->
            <section class="mb-3">
                <p class="text-secondary small mb-0">
                    Mostrando
                    <span id="contador-productos-texto" class="fw-semibold">
                        0 productos
                    </span>
                    en
                    <span id="categoria-actual-texto"
                        class="fw-semibold text-dark">
                        Todas
                    </span>
                </p>
            </section>

            <!-- CATÁLOGO -->
            <section>
                
                <!-- CONTENEDOR DE PRODUCTOS -->
                <div id="contenedor-productos"
                    class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">

                    <!-- RECORRER LOS PRODUCTOS -->
                    <div class="col" th:each="producto : ${productos}">

                        <div class="card producto-card shadow-sm h-100">

                            <!-- IMAGEN -->
                            <div class="producto-imagen-wrapper">

                                <img class="producto-imagen img-fluid"
                                    th:src="@{'/img/' + ${producto.imagen}}"
                                    th:alt="${producto.nombre}">

                                <button type="button"
                                        class="producto-favorito"
                                        aria-label="Agregar a favoritos">
                                    <i class="bi bi-heart"></i>
                                </button>

                            </div>

                            <!-- INFORMACIÓN -->
                            <div class="card-body producto-body d-flex flex-column">

                                <!-- NOMBRE -->
                                <h5 class="producto-nombre"
                                    th:text="${producto.nombre}">
                                    Nombre del producto
                                </h5>

                                <!-- CATEGORÍA -->
                                <p class="text-secondary small"
                                th:text="${producto.categoria.nombre}">
                                    Categoría
                                </p>

                                <!-- BOTÓN -->
                                <div class="mt-auto">

                                    <a class="btn btn-comparar"
                                    th:href="@{/comparar(id=${producto.idProducto})}">
                                        Comparar Precios
                                    </a>

                                </div>

                            </div>

                        </div>

                    </div>

                </div>


                <!-- SIN RESULTADOS -->
                <div id="sin-resultados"
                    class="text-center py-5 d-none">
                    <i class="bi bi-search fs-1 text-secondary"></i>
                    <h5 class="mt-3">No encontramos prendas</h5>
                    <p class="text-secondary">
                        Prueba con otra búsqueda o categoría.
                    </p>
                </div>
            </section>

            <!-- VER TODO -->
            <section class="text-center mt-5">
                <button type="button"
                        id="btn-ver-todo"
                        class="btn btn-catalogo px-4 py-2">
                    Ver Todo el Catálogo
                </button>
            </section>

        </main>

        <!-- FOOTER EXISTENTE -->
        <div th:replace="~{layout :: footer}"></div>

        <!-- DATOS DE THYMELEAF -->
        <script th:inline="javascript">
            const categoriasGlobales = /*[[${categorias}]]*/ [];

            const relacionesServidor = /*[[${listaRelaciones}]]*/ [];
        </script>

        <!-- JAVASCRIPT -->
        <!--script th:src="@{/js/productos.js}"></script>-->

    </body>
</html>
