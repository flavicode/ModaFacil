<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">

    <head th:replace="~{layout :: head('productos.css', 'Catalogo de Prendas')}"></head>

    <body class="catalogo-page">

        <!-- HEADER EXISTENTE -->
        <div th:replace="~{layout :: header}"></div>

        <main class="container catalogo-main py-5">

            <!-- TÍTULO -->
            <section class="mb-4">
                <h1 class="catalogo-titulo fw-bold mb-3">
                    Catálogo de Prendas
                </h1>

                <p class="catalogo-descripcion mb-4">
                    Encuentra las prendas perfectas para tu negocio con
                    total facilidad y transparencia...
                </p>

                <!-- BUSCADOR -->
                <div class="buscador-wrapper">
                    <i class="bi bi-search buscador-icono"></i>

                    <input
                        type="search"
                        id="input-buscador"
                        class="form-control buscador-input"
                        placeholder="Buscar por nombre, categoría, talla..."
                        aria-label="Buscar prendas">
                </div>
            </section>

            <!-- FILTROS DE GÉNERO -->
            <section class="mb-4">
                
                <div class="genero-tabs">
                    <button type="button"
                            class="genero-btn"
                            data-genero="Mujer">Mujer</button>

                    <button type="button"
                            class="genero-btn"
                            data-genero="Hombre">Hombre</button>

                    <button type="button"
                            class="genero-reset"
                            id="ver-todos">Ver todos</button>
                </div>

                <!-- CARRUSEL HORIZONTAL DE CATEGORÍAS -->
                <div class="categorias-carrusel">

                    <button type="button"
                            id="btn-categorias-anterior"
                            class="btn categoria-btn categoria-navegacion"
                            aria-label="Categorías anteriores"
                            hidden>
                        <i class="bi bi-chevron-left"></i>
                    </button>

                    <div id="categorias-viewport"
                        class="categorias-viewport">

                        <div id="contenedor-categorias"
                            class="categorias-track">
                        </div>

                    </div>

                    <button type="button"
                            id="btn-categorias-mas"
                            class="btn categoria-btn categoria-mas">
                        + Más
                    </button>

                </div>

            </section>


            <!-- CATÁLOGO -->
            <section>
                
                <!-- PRODUCTOS GENERADOS DESDE JAVASCRIPT -->
                <div id="contenedor-productos"
                    class="row row-cols-1 row-cols-md-2 row-cols-lg-3 g-4">
                </div>

                <!-- SIN RESULTADOS -->
                <div id="sin-resultados"
                    class="text-center py-5 d-none">
                    <i class="bi bi-search fs-1 text-secondary"></i>
                    <h5 class="mt-3">No encontramos prendas</h5>
                    <p class="text-secondary">
                        Prueba con otra búsqueda o categoría.
                    </p>
                </div>
            </section>

            <!-- VER TODO -->
            <section class="text-center mt-5">
                <button type="button"
                        id="btn-ver-todo"
                        class="btn btn-catalogo px-4 py-2">
                    Ver más
                </button>
            </section>

        </main>

        <!-- FOOTER EXISTENTE -->
        <div th:replace="~{layout :: footer}"></div>

        <!-- DATOS DE THYMELEAF -->
        <script th:inline="javascript">
            const categoriasGlobales = /*[[${categorias}]]*/ [];

            const relacionesServidor = /*[[${listaRelaciones}]]*/ [];
        </script>

        
        <!-- DATOS ENVIADOS DESDE SPRING BOOT -->
        <script th:inline="javascript">
            window.relacionesServidor =
                /*[[${relacionesServidor}]]*/ [];
        </script>

        <!-- 1. PROCESAMIENTO DE DATOS -->
        <script th:src="@{/js/productos-data.js}" defer></script>

        <!-- JAVASCRIPT DE PRODUCTO-->
        <script th:src="@{/js/productos.js}" defer></script>

        <!-- JAVASCRIPT DEL CATÁLOGO -->
        <script th:src="@{/js/catalogo.js}" defer></script>
    </body>
</html>
