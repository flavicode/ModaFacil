<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
    <head th:fragment="headAdmin(titleText)">
        <meta charset="UTF-8"/>
        <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
        <title th:text="|ModaFácil Admin - ${titleText}|">ModaFácil Admin</title>
        <!-- Fuentes -->
        <link rel="preconnect" href="https://googleapis.com"/>
        <link rel="preconnect" href="https://gstatic.com" crossorigin/>
        <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100..900&display=swap" rel="stylesheet"/>
        <!-- Bootstrap & Icons -->
        <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"/>
        <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css" integrity="sha384-Bk5cbLkZQ5raZ0+H2/+VbfYx3WpvxvQK4zqXZr7sYODuaX7bKXoSOnipQxkaS8sv" crossorigin="anonymous"/>
        <!-- CSS -->
        <link rel="stylesheet" th:href="@{/css/style-global.css(v=2)}"/>
        <link rel="stylesheet" th:href="@{/css/admin.css(v=2)}"/>
        <link rel="icon" type="image/png" th:href="@{/img/logo.png}"/>
    </head>
    <body>

        <!-- HEADER -->
        <header th:fragment="headerAdmin" class="navbar navbar-light bg-background border-bottom sticky-top px-3 px-lg-4 py-2" style="height: 68px; z-index: 1030;">
            <div class="d-flex align-items-center gap-3">
                <button class="btn border-0 p-1 d-lg-none text-primary" type="button" data-bs-toggle="offcanvas" data-bs-target="#sidebarAdmin" aria-controls="sidebarAdmin">
                    <i class="bi bi-list fs-2"></i>
                </button>
                <a class="navbar-brand d-flex align-items-center gap-2 fw-bold fs-4 text-primary m-0" href="/admin/dashboard">
                    <img th:src="@{/img/logo.png}" alt="Logo ModaFácil" class="rounded-3" style="width: 36px; height: 36px; object-fit: cover;">
                    <span>Moda<span class="text-success">Fácil</span></span>
                </a>
            </div>

            <!-- Perfil Administrador a la derecha -->
            <div class="ms-auto d-flex align-items-center gap-3">
                <div class="dropdown">
                    <div class="d-flex align-items-center gap-2 px-2 py-1 rounded-3 cursor-pointer user-select-none" 
                        id="adminDropdown" data-bs-toggle="dropdown" aria-expanded="false">
                        <i class="bi bi-person-circle fs-3 text-secondary"></i>
                        <span class="fw-medium small text-dark d-none d-sm-inline" th:text="${session.logged?.nombre ?: 'Administrador'}">Administrador</span>
                        <i class="bi bi-chevron-down small text-muted"></i>
                    </div>
                    <ul class="dropdown-menu dropdown-menu-end border-0 shadow-sm rounded-3 mt-2" aria-labelledby="adminDropdown">
                        <li>
                            <a class="dropdown-item d-flex align-items-center gap-2 small py-2" href="/">
                                <i class="bi bi-shop text-muted"></i> Ir a la tienda
                            </a>
                        </li>
                        <li><hr class="dropdown-divider my-1"></li>
                        <li>
                            <a class="dropdown-item d-flex align-items-center gap-2 small py-2 text-danger" href="/logout">
                                <i class="bi bi-box-arrow-right"></i> Cerrar Sesión
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </header>

        <aside th:fragment="sidebarAdmin" class="offcanvas-lg offcanvas-start bg-background border-end admin-sidebar" tabindex="-1" id="sidebarAdmin" aria-labelledby="sidebarAdminLabel">
            <div class="offcanvas-header border-bottom d-lg-none">
                <h5 class="offcanvas-title fw-bold text-primary" id="sidebarAdminLabel">Panel Administrativo</h5>
                <button type="button" class="btn-close" data-bs-dismiss="offcanvas" data-bs-target="#sidebarAdmin" aria-label="Cerrar"></button>
            </div>

            <!-- Contenido del menú lateral -->
            <div class="offcanvas-body d-flex flex-column justify-content-between h-100 p-3">
                <div>
                    <p class="fw-bold text-primary small px-3 mb-3 d-none d-lg-block">Panel Administrativo</p>
                    
                    <nav class="nav flex-column gap-1">
                        <a class="admin-nav-link" th:classappend="${paginaActual == 'dashboard' ? 'active' : ''}" href="/admin/dashboard">
                            <i class="bi bi-grid"></i>
                            <span>Dashboard</span>
                        </a>
                        <a class="admin-nav-link" th:classappend="${paginaActual == 'productos' ? 'active' : ''}" href="/admin/productos">
                            <i class="bi bi-box-seam"></i>
                            <span>Productos</span>
                        </a>
                        <a class="admin-nav-link" th:classappend="${paginaActual == 'inventario' ? 'active' : ''}" href="/admin/inventario">
                            <i class="bi bi-layers"></i>
                            <span>Inventario</span>
                        </a>
                        <a class="admin-nav-link" th:classappend="${paginaActual == 'ventas' ? 'active' : ''}" href="/admin/ventas">
                            <i class="bi bi-credit-card"></i>
                            <span>Ventas y pagos</span>
                        </a>
                        <a class="admin-nav-link" th:classappend="${paginaActual == 'proveedores' ? 'active' : ''}" href="/admin/proveedores">
                            <i class="bi bi-truck"></i>
                            <span>Proveedores</span>
                        </a>
                    </nav>
                </div>

                <!-- Cerrar sesión al fondo del aside -->
                <div class="pt-3 border-top">
                    <a class="admin-nav-link text-danger" href="/logout">
                        <i class="bi bi-box-arrow-left"></i>
                        <span>Cerrar Sesión</span>
                    </a>
                </div>
            </div>
        </aside>

        <!-- SCRIPTS -->
        <div th:fragment="scriptsAdmin">
            <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
            <script th:src="@{/js/main.js}"></script>
        </div>
    </body>
</html>
