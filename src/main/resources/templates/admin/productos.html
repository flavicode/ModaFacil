<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
    <head th:replace="~{layout-admin :: headAdmin('Productos')}"></head>
    <body>

        <!-- Header superior -->
        <header th:replace="~{layout-admin :: headerAdmin}"></header>

        <!-- Contenedor Aside + Main -->
        <div class="admin-wrapper">
            <aside th:replace="~{layout-admin :: sidebarAdmin}"></aside>

            <main class="admin-main p-4 p-lg-5">
                <!-- Breadcrumb y Título -->
                <nav aria-label="breadcrumb" class="small text-muted mb-1">
                    <i class="bi bi-house"></i> / Dashboard
                </nav>
                <h2 class="fw-bold text-primary mb-1">Productos</h2>
                <p class="text-muted mb-4">Gestiona el catálogo de productos de ModaFacil</p>

                <!-- FILTROS DE PRODUCTOS -->
                <form id="formFiltros"
                    class="filtros-productos"
                    th:action="@{/admin/productos}"
                    method="get">

                    <div class="row g-3 align-items-center">

                        <!-- Buscador -->
                        <div class="col-12 col-md-5">
                            <div class="input-group">

                                <span class="input-group-text">
                                    <i class="bi bi-search"></i>
                                </span>

                                <input type="text"
                                    id="buscarProducto"
                                    name="busqueda"
                                    class="form-control"
                                    th:value="${busqueda}"
                                    placeholder="Buscar producto (nombre, código...)"
                                    aria-label="Buscar producto">

                            </div>
                        </div>

                        <!-- Filtro de estado -->
                        <div class="col-12 col-md-3">
                            <div class="input-group">

                                <label class="input-group-text"
                                    for="filtroEstado">
                                    Estado:
                                </label>

                                <select id="filtroEstado"
                                        name="estado"
                                        class="form-select">

                                    <option value="todos"
                                            th:selected="${estado == 'todos'}">
                                        Todos
                                    </option>

                                    <option value="activo"
                                            th:selected="${estado == 'activo'}">
                                        Activo
                                    </option>

                                    <option value="inactivo"
                                            th:selected="${estado == 'inactivo'}">
                                        Inactivo
                                    </option>

                                </select>

                            </div>
                        </div>

                        <!-- Botón recargar -->
                        <div class="col-auto ms-md-auto">

                            <a th:href="@{/admin/productos}"
                            class="btn btn-recargar"
                            title="Recargar productos"
                            aria-label="Recargar productos">

                                <i class="bi bi-arrow-clockwise"></i>

                            </a>

                        </div>

                    </div>

                    <noscript>
                        <button type="submit" class="btn btn-primary mt-3">
                            Buscar
                        </button>
                    </noscript>

                </form>

                <p id="mensajeFiltros"
                class="text-muted small"
                role="status"></p>

                <!-- RESULTADOS DE PRODUCTOS -->
                <div id="resultadosProductos">

                    <div class="table-responsive tabla-productos">

                        <table class="table align-middle mb-0">

                            <thead>
                                <tr>
                                    <th>#</th>
                                    <th>Producto</th>
                                    <th>Estado</th>
                                    <th>Acciones</th>
                                </tr>
                            </thead>

                            <tbody>

                                <tr th:each="producto, iter : ${productos}">

                                    <!-- Número de fila -->
                                    <td th:text="${iter.count}"></td>

                                    <!-- Producto -->
                                    <td>
                                        <div class="d-flex align-items-center gap-3">

                                            <img th:if="${producto.imagen() != null}"
                                                th:src="@{/img/{archivo}(archivo=${producto.imagen()})}"
                                                class="imagen-producto"
                                                alt="Producto">

                                            <div>

                                                <strong th:text="${producto.nombre()}">
                                                </strong>

                                                <div class="text-muted small"
                                                    th:text="${producto.codigo() + ' · ' + producto.categoria()}">
                                                </div>

                                            </div>

                                        </div>
                                    </td>

                                    <!-- Estado -->
                                    <td>
                                        <div class="d-flex align-items-center gap-3">

                                            <span class="estado-producto"
                                                th:classappend="${producto.activo()}
                                                    ? 'estado-activo' : 'estado-inactivo'"
                                                th:text="${producto.activo()}
                                                    ? 'Activo' : 'Inactivo'">
                                            </span>

                                            <div class="form-check form-switch mb-0">

                                                <input type="checkbox"
                                                    class="form-check-input switch-estado"
                                                    role="switch"
                                                    th:checked="${producto.activo()}"
                                                    th:data-id="${producto.idProducto()}"
                                                    th:data-url="@{/admin/productos/{id}/estado(id=${producto.idProducto()})}"
                                                    th:aria-label="|Cambiar estado de ${producto.nombre()}|">

                                            </div>

                                        </div>
                                    </td>

                                    <!-- Acciones -->
                                    <td>
                                        <div class="d-flex align-items-center gap-2">

                                            <!-- Ver detalle -->
                                            <button type="button"
                                                    class="btn btn-accion btn-detalle"
                                                    th:data-id="${producto.idProducto()}"
                                                    th:data-url="@{/admin/productos/{id}/detalle(id=${producto.idProducto()})}"
                                                    title="Ver detalle"
                                                    aria-label="Ver detalle">

                                                <i class="bi bi-eye"></i>

                                            </button>

                                            <!-- Editar producto -->
                                            <button type="button"
                                                    class="btn btn-accion btn-editar"
                                                    th:data-id="${producto.idProducto()}"
                                                    title="Editar producto"
                                                    aria-label="Editar producto">

                                                <i class="bi bi-pencil"></i>

                                            </button>

                                        </div>
                                    </td>

                                </tr>

                                <!-- Sin resultados -->
                                <tr th:if="${#lists.isEmpty(productos)}">

                                    <td colspan="4"
                                        class="text-center text-muted py-5">

                                        No se encontraron productos.

                                    </td>

                                </tr>

                            </tbody>

                        </table>

                    </div>

                    <!-- Contador de productos -->
                    <p class="text-muted mt-3"
                    th:text="|Mostrando ${#lists.size(productos)} de ${totalProductos} productos|">
                    </p>

                </div>
            </main>
        </div>

        <!-- MODAL DETALLE DEL PRODUCTO-->
        <div class="modal fade"
            id="modalDetalleProducto"
            tabindex="-1"
            aria-labelledby="tituloModalDetalle"
            aria-hidden="true"
            th:data-img-base="@{/img/}">

            <div class="modal-dialog modal-lg modal-dialog-centered
                        modal-dialog-scrollable">

                <div class="modal-content detalle-modal">

                    <!-- CABECERA DEL MODAL -->
                    <div class="modal-header detalle-header">

                        <div class="d-flex align-items-center gap-3">

                            <div class="detalle-icono-header">
                                <i class="bi bi-box-seam"></i>
                            </div>

                            <h5 class="modal-title fw-bold"
                                id="tituloModalDetalle">
                                Detalle del producto
                            </h5>

                        </div>

                        <!-- Botón X -->
                        <button type="button"
                                class="btn-close"
                                data-bs-dismiss="modal"
                                aria-label="Cerrar">
                        </button>

                    </div>

                    <!-- CUERPO DEL MODAL -->
                    <div class="modal-body p-4">

                        <!-- Mensaje de carga o error -->
                        <div id="detalleMensaje"
                            class="text-center py-4"
                            role="status">
                        </div>

                        <div id="detalleContenido" class="d-none">

                            <!-- INFORMACIÓN PRINCIPAL -->
                            <div class="row g-4 mb-4 align-items-center">

                                <!-- Imagen -->
                                <div class="col-12 col-md-4">

                                    <div class="detalle-imagen-contenedor">

                                        <img id="detalleImagen"
                                            class="detalle-imagen"
                                            alt="Imagen del producto">

                                    </div>

                                </div>

                                <!-- Información -->
                                <div class="col-12 col-md-8">

                                    <h4 id="detalleNombre"
                                        class="fw-bold mb-2">
                                    </h4>

                                    <span id="detalleCodigo"
                                        class="detalle-codigo">
                                    </span>

                                    <div class="detalle-informacion mt-3">

                                        <!-- Categoría -->
                                        <div class="detalle-dato">

                                            <i class="bi bi-layers"></i>

                                            <div>
                                                <small>Categoría:</small>
                                                <strong id="detalleCategoria">
                                                </strong>
                                            </div>

                                        </div>

                                        <hr>

                                        <!-- Estado -->
                                        <div class="detalle-dato">

                                            <i class="bi bi-check-circle"></i>

                                            <div>
                                                <small>Estado:</small>

                                                <span id="detalleEstado"
                                                    class="estado-producto">
                                                </span>
                                            </div>

                                        </div>

                                    </div>

                                </div>

                            </div>

                            <!-- DESCRIPCIÓN -->
                            <section class="detalle-seccion mb-3">

                                <h5 class="detalle-titulo-seccion">

                                    <i class="bi bi-file-earmark-text"></i>
                                    Descripción

                                </h5>

                                <p id="detalleDescripcion"
                                class="mb-0">
                                </p>

                            </section>

                            <!-- ESPECIFICACIONES -->
                            <section class="detalle-seccion">

                                <h5 class="detalle-titulo-seccion">

                                    <i class="bi bi-gear"></i>
                                    Especificaciones

                                </h5>

                                <div class="row g-4">

                                    <!-- Características -->
                                    <div class="col-12 col-md-6">

                                        <div class="detalle-especificacion">
                                            <i class="bi bi-flower1"></i>
                                            <strong>Material:</strong>
                                            <span id="detalleMaterial"></span>
                                        </div>

                                        <div class="detalle-especificacion">
                                            <i class="bi bi-grid"></i>
                                            <strong>Tipo de tela:</strong>
                                            <span id="detalleTipoTela"></span>
                                        </div>

                                        <div class="detalle-especificacion">
                                            <i class="bi bi-arrows-expand"></i>
                                            <strong>Ajuste:</strong>
                                            <span id="detalleAjuste"></span>
                                        </div>

                                        <div class="detalle-especificacion">
                                            <i class="bi bi-diamond"></i>
                                            <strong>Manga:</strong>
                                            <span id="detalleManga"></span>
                                        </div>

                                        <div class="detalle-especificacion">
                                            <i class="bi bi-circle"></i>
                                            <strong>Cuello:</strong>
                                            <span id="detalleCuello"></span>
                                        </div>

                                        <div class="detalle-especificacion">
                                            <i class="bi bi-person"></i>
                                            <strong>Género:</strong>
                                            <span id="detalleGenero"></span>
                                        </div>

                                        <div class="detalle-especificacion">
                                            <i class="bi bi-calendar-event"></i>
                                            <strong>Ocasión:</strong>
                                            <span id="detalleOcasion"></span>
                                        </div>

                                    </div>

                                    <!-- Tallas -->
                                    <div class="col-12 col-md-6
                                                detalle-columna-tallas">

                                        <h6 class="fw-bold mb-3">

                                            <i class="bi bi-tag me-2"></i>
                                            Tallas registradas

                                        </h6>

                                        <div id="detalleTallas"
                                            class="d-flex flex-wrap gap-2">
                                        </div>

                                    </div>

                                </div>

                            </section>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <div th:replace="~{layout-admin :: scriptsAdmin}"></div>
        <script th:src="@{/js/admin-productos.js}"></script>
    </body>
</html>
