<!DOCTYPE html>
<html lang="es" xmlns:th="http://thymeleaf.org">
    <head th:replace="~{layout :: head('login.css', 'Iniciar sesión')}"></head>

    <body class="bg-light-layout min-vh-100 d-flex flex-column">

        <!-- HEADER -->
        <div th:replace="~{layout :: header}"></div>

        <!-- MAIN -->
        <main class="container flex-grow-1 d-flex align-items-center justify-content-center py-5">
            <!-- Formulario Iniciar Sesión -->
            <div class="card card-login border-0 p-4 p-sm-5 rounded-5 shadow-sm bg-white">
                <div class="text-center mb-4">
                    <h1 class="h2 fw-bold text-dark mb-2">Bienvenido</h1>
                    <p class="text-muted small">Ingresa tus credenciales para acceder a tu cuenta</p>
                </div>

                <!-- Alerta de Registro Exitoso -->
                <div th:if="${param.registrado != null}" class="alert alert-success border-0 rounded-3 small fw-medium mb-4 d-flex align-items-center gap-2">
                    <i class="bi bi-check-circle-fill"></i>
                    <span>¡Cuenta creada con éxito! Ya puedes iniciar sesión con tus credenciales.</span>
                </div>
                
                <!-- Alerta de Error en Login -->
                <div th:if="${errorLogin != null}" class="alert alert-danger border-0 rounded-3 small fw-medium mb-4 d-flex align-items-center gap-2">
                    <i class="bi bi-exclamation-triangle-fill"></i>
                    <span th:text="${errorLogin}">Mensaje de error genérico</span>
                </div>

                <form id="formulario-login" th:action="@{/login}" method="POST" class="needs-validation" novalidate>
                    
                    <!-- Campo Correo -->
                    <div class="mb-3">
                        <label for="username" class="form-label small fw-bold text-dark mb-2">Correo electrónico</label>
                        <div class="input-group input-group-custom">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-envelope"></i></span>
                            <input type="email" id="username" name="correo" autocomplete="username" 
                                class="form-control border-start-0 ps-0 text-dark fw-medium" placeholder="ejemplo@correo.com" required>
                        </div>
                        <div class="text-danger small mt-1 d-none" id="error-login-correo">Ingresa un correo electrónico válido.</div>
                    </div>

                    <!-- Campo Contraseña -->
                    <div class="mb-4">
                        <label for="password" class="form-label small fw-bold text-dark mb-2">Contraseña</label>
                        <div class="input-group input-group-custom">
                            <span class="input-group-text bg-white border-end-0 text-muted"><i class="bi bi-lock"></i></span>
                            <input type="password" id="password" name="password" autocomplete="current-password" 
                                class="form-control border-start-0 border-end-0 ps-0 text-dark fw-medium" placeholder="••••••••" required>
                            <span id="btnTogglePassword" class="input-group-text bg-white border-start-0 text-muted cursor-pointer"><i class="bi bi-eye" id="iconEye"></i></span>
                        </div>
                        <div class="text-danger small mt-1 d-none" id="error-login-password">La contraseña es obligatoria.</div>
                    </div>

                    <!-- Botón de Envío -->
                    <button type="submit" class="btn bg-success text-white w-100 py-3 fw-bold rounded-3 border-0 mb-4 shadow-sm">
                        Iniciar Sesión
                    </button>
                    
                    <!-- Enlace redirigiendo a una página externa de registro -->
                    <div class="text-center small">
                        <span class="text-muted">¿Eres nuevo en ModaFácil? </span>
                        <a href="/registro" class="text-success fw-bold text-decoration-none">Crear cuenta</a>
                    </div>
                </form>
            </div>
        </main>

        <script th:src="@{/js/login.js}"></script>
        <!-- FOOTER -->
        <div th:replace="~{layout :: footer}"></div>
    </body>
</html>
